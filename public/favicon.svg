<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Fondo con degradado radial simulando la neblina y luz de la portada -->
  <defs>
    <radialGradient id="mistGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1B3E51"/>
      <stop offset="70%" stop-color="#0B151C"/>
      <stop offset="100%" stop-color="#050B10"/>
    </radialGradient>
    
    <!-- Degradado para la silueta retroiluminada -->
    <linearGradient id="backlight" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#56C1E8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#014A70"/>
    </linearGradient>
  </defs>

  <!-- Rectángulo de fondo -->
  <rect width="32" height="32" rx="8" fill="url(#mistGlow)"/>

  <!-- Silueta de la persona de espaldas -->
  <path d="M 5,32 C 5,24 9,18 12,17 C 12.5,16 13,15.5 13,14.5 C 11.5,13.5 11,11.5 11,9.5 C 11,6.5 13.2,4.5 16,4.5 C 18.8,4.5 21,6.5 21,9.5 C 21,11.5 20.5,13.5 19,14.5 C 19,15.5 19.5,16 20,17 C 23,18 27,24 27,32 Z" 
        fill="#080F14" 
        stroke="url(#backlight)" 
        stroke-width="1.2" 
        stroke-linejoin="round"/>
</svg>
