<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Fondo azul noche a juego con el tema de la web -->
  <rect width="32" height="32" rx="8" fill="#0D1B24"/>
  
  <!-- Anillo exterior del laberinto (Radio 12) -->
  <circle cx="16" cy="16" r="12" stroke="#C4B896" stroke-width="1.8" stroke-dasharray="22 6 22 6 15 4" transform="rotate(45 16 16)" />
  
  <!-- Anillo intermedio del laberinto (Radio 8) -->
  <circle cx="16" cy="16" r="8" stroke="#C4B896" stroke-width="1.8" stroke-dasharray="15 5 15 5 8 2" transform="rotate(-30 16 16)" />
  
  <!-- Anillo interno del laberinto (Radio 4) -->
  <circle cx="16" cy="16" r="4" stroke="#C4B896" stroke-width="1.8" stroke-dasharray="10 4 8 3" transform="rotate(15 16 16)" />
  
  <!-- Silueta/Centro (El centro del laberinto) -->
  <circle cx="16" cy="16" r="1" fill="#C4B896" />
  
  <!-- Paredes radiales del laberinto -->
  <path d="M16 4v4M16 24v4M4 16h4M24 16h4M16 12v4M12 16h4" stroke="#C4B896" stroke-width="1.5" stroke-linecap="round" />
</svg>
